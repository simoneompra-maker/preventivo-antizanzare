<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2B2A">
<title>Preventivo Rapido</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #1A2B2A;
    --surface: #2A4B41;
    --surface-2: #234036;
    --line: #3c6357;
    --gold: #FFD700;
    --gold-soft: #FFEE75;
    --text: #E0E0E0;
    --muted: #a9bdb6;
    --ok: #34D399;
    --warn: #F59E0B;
    --err: #f87171;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 0 12px; }
  header h1 { font-size: 1.15rem; margin: 0; color: var(--gold); flex: 1; }
  header button { background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 10px; padding: 6px 10px; font-size: .85rem; }
  .stato { font-size: .8rem; color: var(--muted); margin: -6px 0 12px; }
  .stato.off { color: var(--warn); }
  .card { background: var(--surface); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
  .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0 0 8px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg.v { grid-auto-flow: row; }
  .seg button { min-height: 46px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text); font-size: .95rem; padding: 8px; }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #1A2B2A; border-color: var(--gold);
    font-weight: 600; }
  .seg button:disabled { opacity: .4; }
  .riga { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  input[type=number], input[type=email], input[type=password] {
    width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 1.2rem; padding: 8px 12px; }
  .unita { color: var(--muted); min-width: 32px; }
  .nota { font-size: .82rem; color: var(--muted); margin-top: 6px; }
  .switch { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .switch + .switch { border-top: 1px solid var(--line); }
  .switch input { width: 48px; height: 28px; accent-color: var(--gold); }
  .switch .fisso { color: var(--muted); font-size: .9rem; }
  .ris { border: 2px solid var(--gold); }
  .big { font-size: 1.6rem; font-weight: 700; color: var(--gold); margin: 2px 0; }
  .sub { color: var(--muted); font-size: .9rem; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .kv span:last-child { white-space: nowrap; }
  .sep { border-top: 1px solid var(--line); margin: 8px 0; }
  details summary { cursor: pointer; color: var(--gold-soft); padding: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  td { padding: 5px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  td.n { text-align: right; white-space: nowrap; padding-left: 8px; }
  .avviso { background: rgba(245,158,11,.15); border-left: 3px solid var(--warn); padding: 8px 10px;
    border-radius: 6px; font-size: .88rem; margin-top: 8px; }
  .errore { background: rgba(248,113,113,.15); border-left: 3px solid var(--err); padding: 10px;
    border-radius: 6px; }
  .azioni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn { min-height: 48px; border-radius: 10px; border: 0; font-size: 1rem; font-weight: 600; }
  .btn.p { background: var(--gold); color: #1A2B2A; }
  .btn.s { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; }
  #login form { display: grid; gap: 10px; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ok);
    color: #10231d; padding: 10px 16px; border-radius: 10px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>⚡ Preventivo rapido antizanzare</h1>
    <button id="esci" class="hidden" type="button">Esci</button>
  </header>

  <!-- LOGIN -->
  <section id="login" class="card hidden">
    <p class="lbl">Accesso OMPRA</p>
    <form id="formLogin">
      <input id="email" type="email" autocomplete="username" placeholder="Email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn p" type="submit">Entra</button>
      <div id="erroreLogin" class="errore hidden"></div>
    </form>
    <p class="nota">Stesso account dell'app OMPRA.</p>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <p id="stato" class="stato"></p>

    <div class="card">
      <p class="lbl">Brand</p>
      <div class="seg" id="segBrand"></div>
    </div>

    <div class="card">
      <p class="lbl">Misura</p>
      <div class="seg" id="segModo">
        <button type="button" data-v="perimetro">Perimetro</button>
        <button type="button" data-v="area">Area</button>
      </div>
      <div class="riga">
        <input id="valore" type="number" inputmode="decimal" min="0" step="1" placeholder="0">
        <span id="unita" class="unita">m</span>
      </div>
      <p id="notaMisura" class="nota"></p>
    </div>

    <div class="card">
      <p class="lbl">Configurazione</p>
      <div class="seg v" id="segConfig"></div>
      <div id="boxProdotto" style="margin-top:10px">
        <p class="lbl">Prodotto</p>
        <div class="seg" id="segProdotto">
          <button type="button" data-v="insetticida">Insetticida</button>
          <button type="button" data-v="repellente">Repellente</button>
        </div>
      </div>
    </div>

    <div class="card">
      <label class="switch"><span>WiFi / gestione da app</span>
        <input id="wifi" type="checkbox"><span id="wifiFisso" class="fisso hidden">sempre inclusa</span></label>
      <label class="switch"><span>Installazione e collaudo</span>
        <input id="inst" type="checkbox" checked></label>
    </div>

    <div id="risultato"></div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<!-- Libreria Supabase copiata nel repo (v2.45.4): niente CDN, cosi' l'app
     si apre anche offline. -->
<script src="supabase.min.js"></script>
<script type="module">
const { createClient } = window.supabase;
import { calcola, testoCliente, BRAND, CONFIGURAZIONI, REGOLE, eur } from './calcolo.js';

/* Progetto Supabase dell'app OMPRA. La chiave e' quella pubblica (anon):
   i dati restano protetti dalle regole RLS, servono login e password. */
const SUPABASE_URL = 'https://eoswkplehhmtxtattsha.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc3drcGxlaGhtdHh0YXR0c2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY2MTY3NzcsImV4cCI6MjA4MjE5Mjc3N30.cUg61XjJf2fmTi6dAQ2EaBl49pRrtgBTN7A2EyMyvLI';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'pr-antizanzare-auth' },
});

const CACHE_KEY = 'pr-antizanzare-catalogo';
const PREF_KEY = 'pr-antizanzare-scelte';
const $ = (id) => document.getElementById(id);

let catalogo = null; // { versione, dati, pubblicato_il, fonte }
const stato = Object.assign(
  { brand: 'pro', modo: 'perimetro', valore: '', config: 'uno', prodotto: 'insetticida', wifi: false, installazione: true },
  leggi(PREF_KEY) || {}
);
stato.valore = '';

/* Con rete scarsa (campagna, cantiere) una richiesta puo' restare appesa:
   dopo qualche secondo si va avanti con la copia salvata. */
const conTimeout = (p, ms = 5000) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms)),
]);

function leggi(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function scrivi(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* niente */ } }

/* ───────── catalogo: Supabase → copia locale → riserva ───────── */
async function caricaCatalogo() {
  try {
    const { data, error } = await conTimeout(sb.from('az_catalogo_pubblicato')
      .select('versione, dati, pubblicato_il').eq('id', 'antizanzare').maybeSingle());
    if (error) throw error;
    if (data) {
      catalogo = { ...data, fonte: 'online' };
      scrivi(CACHE_KEY, data);
      return;
    }
  } catch (e) { console.warn('Catalogo online non disponibile:', e?.message || e); }

  const locale = leggi(CACHE_KEY);
  if (locale?.dati) { catalogo = { ...locale, fonte: 'locale' }; return; }

  const r = await fetch('catalogo-riserva.json');
  const riserva = await r.json();
  catalogo = { ...riserva, pubblicato_il: null, fonte: 'riserva' };
}

function mostraStato() {
  const el = $('stato');
  const data = catalogo.pubblicato_il
    ? new Date(catalogo.pubblicato_il).toLocaleDateString('it-IT') : null;
  if (catalogo.fonte === 'online') {
    el.textContent = `Listino aggiornato dall'app OMPRA · ${data}`;
    el.className = 'stato';
  } else if (catalogo.fonte === 'locale') {
    el.textContent = `Offline · uso il listino salvato del ${data}`;
    el.className = 'stato off';
  } else {
    el.textContent = 'Listino di riserva (03/10/2026): apri il modulo antizanzare dell\'app OMPRA per aggiornarlo';
    el.className = 'stato off';
  }
}

/* ───────── interfaccia ───────── */
function seg(container, opzioni, chiave) {
  container.innerHTML = '';
  opzioni.forEach((o) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.v = o.id;
    b.textContent = o.label;
    b.addEventListener('click', () => { stato[chiave] = o.id; aggiorna(); });
    container.appendChild(b);
  });
}

function premi(container, valore, disabilitati = []) {
  container.querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.v === valore));
    b.disabled = disabilitati.includes(b.dataset.v);
  });
}

function aggiorna() {
  // il raffrescamento esiste solo per Gardheaven
  if (stato.config === 'raffresc' && stato.brand !== 'gardheaven') stato.config = 'uno';

  premi($('segBrand'), stato.brand);
  premi($('segModo'), stato.modo);
  premi($('segConfig'), stato.config,
    stato.brand === 'gardheaven' ? [] : ['raffresc']);
  $('segConfig').querySelector('[data-v="raffresc"]')
    .classList.toggle('hidden', stato.brand !== 'gardheaven');
  premi($('segProdotto'), stato.prodotto);
  $('boxProdotto').classList.toggle('hidden', stato.config !== 'uno');

  $('unita').textContent = stato.modo === 'area' ? 'mq' : 'm';
  const v = parseFloat(String(stato.valore).replace(',', '.')) || 0;
  $('notaMisura').textContent = stato.modo === 'area' && v > 0
    ? `Forma regolare: perimetro ≈ 4 × √${v} = ${Math.round(4 * Math.sqrt(v))} m`
    : stato.config === 'raffresc' ? `Un ugello ogni ${String(REGOLE.passoRaffrescamento).replace('.', ',')} m`
    : 'Un ugello ogni 4 m';

  // WiFi: Stocker e' sempre in app; lo DUAL Zanzero pure
  const sempreWifi = stato.brand === 'geyser'
    || (stato.brand === 'pro' && stato.config !== 'uno');
  $('wifi').classList.toggle('hidden', sempreWifi);
  $('wifiFisso').classList.toggle('hidden', !sempreWifi);
  $('wifi').checked = stato.wifi;
  $('inst').checked = stato.installazione;

  scrivi(PREF_KEY, { ...stato, valore: '' });
  mostraRisultato();
}

function riga(k, v, cls = '') { return `<div class="kv ${cls}"><span>${k}</span><span>${v}</span></div>`; }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let ultimo = null;

function mostraRisultato() {
  const box = $('risultato');
  const r = calcola(catalogo.dati, stato);
  ultimo = r;
  if (!r.ok) {
    box.innerHTML = r.errore ? `<div class="card errore">${esc(r.errore)}</div>` : '';
    return;
  }
  const ivaPct = Math.round(r.iva * 100);
  box.innerHTML = `
    <div class="card ris">
      <p class="lbl">Impianto${r.installazione > 0 ? ' installato' : ' (solo fornitura)'}</p>
      <div class="big">${eur(r.impiantoMin)} – ${eur(r.impiantoMax)}</div>
      <div class="sub">+ IVA ${ivaPct}% · stima ${eur(r.impianto)}</div>
      <div class="sep"></div>
      ${riga('Centralina', esc(r.centralina.label))}
      ${riga('Ugelli', `${r.ugelliTot}${r.circuiti > 1 ? ` (${r.ugelliCircuito} × 2 circuiti)` : ''}`)}
      ${riga('Perimetro', `${Math.round(r.perimetro)} m${r.perimetroStimato ? ' (stimato)' : ''}`)}
      ${riga('Materiale', eur(r.materiale, 2))}
      ${r.installazione > 0 ? riga('Installazione e collaudo', eur(r.installazione, 2)) : ''}
      ${r.prodotti.length ? `<div class="sep"></div>
        ${riga('<b>Prodotti 1ª stagione</b>', `<b>${eur(r.costoProdotti, 2)}</b>`)}
        ${r.prodotti.map((p) => riga(
          `<span class="sub">${esc(p.label)} × ${p.confezioni}</span>`,
          `<span class="sub">${p.litriStagione.toFixed(1).replace('.', ',')} L</span>`)).join('')}
        <div class="sep"></div>
        ${riga('Totale con prodotti', `${eur(r.totale, 2)} + IVA`)}
        ${riga('<span class="sub">IVA inclusa</span>', `<span class="sub">${eur(r.totale * (1 + r.iva), 2)}</span>`)}`
        : riga('<span class="sub">IVA inclusa</span>', `<span class="sub">${eur(r.impianto * (1 + r.iva), 2)}</span>`)}
      ${r.avvisi.map((a) => `<div class="avviso">${esc(a)}</div>`).join('')}
      <details>
        <summary>Dettaglio voci (listino IVA esclusa)</summary>
        <table>${r.voci.map((v) => `<tr><td>${esc(v.desc)}<br><span class="sub">${v.q} ${v.um} × ${eur(v.unit, 2)}</span></td><td class="n">${eur(v.tot, 2)}</td></tr>`).join('')}
        ${r.installazione > 0 ? `<tr><td>Installazione e collaudo<br><span class="sub">${eur(REGOLE.installazione.fisso)} + ${r.ugelliTot} × ${eur(REGOLE.installazione.perUgello)}</span></td><td class="n">${eur(r.installazione, 2)}</td></tr>` : ''}
        </table>
        <p class="nota">Forbice ±${Math.round(REGOLE.forbice * 100)}% per accessori e imprevisti non conteggiati. Consumi stimati su ${REGOLE.mesiStagione} mesi con i cicli abituali del modulo antizanzare.</p>
      </details>
      <div class="azioni">
        <button class="btn p" id="wa" type="button">WhatsApp</button>
        <button class="btn s" id="copia" type="button">Copia</button>
      </div>
    </div>`;
  $('wa').addEventListener('click', () => {
    window.open('https://wa.me/?text=' + encodeURIComponent(testoCliente(ultimo)), '_blank');
  });
  $('copia').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(testoCliente(ultimo)); toast('Copiato'); }
    catch { toast('Copia non riuscita'); }
  });
}

function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 1600);
}

function preparaInterfaccia() {
  seg($('segBrand'), BRAND, 'brand');
  seg($('segConfig'), CONFIGURAZIONI, 'config');
  $('segModo').querySelectorAll('button').forEach((b) =>
    b.addEventListener('click', () => { stato.modo = b.dataset.v; aggiorna(); }));
  $('segProdotto').querySelectorAll('button').forEach((b) =>
    b.addEventListener('click', () => { stato.prodotto = b.dataset.v; aggiorna(); }));
  $('valore').addEventListener('input', (e) => { stato.valore = e.target.value; aggiorna(); });
  $('wifi').addEventListener('change', (e) => { stato.wifi = e.target.checked; aggiorna(); });
  $('inst').addEventListener('change', (e) => { stato.installazione = e.target.checked; aggiorna(); });
}

/* ───────── avvio e login ───────── */
async function entraInApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('esci').classList.remove('hidden');
  await caricaCatalogo();
  mostraStato();
  aggiorna();
}

function mostraLogin() {
  $('app').classList.add('hidden');
  $('esci').classList.add('hidden');
  $('login').classList.remove('hidden');
}

$('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('erroreLogin');
  err.classList.add('hidden');
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value,
  });
  if (error) {
    err.textContent = navigator.onLine ? 'Email o password non corrette.' : 'Sei offline: serve la rete per il primo accesso.';
    err.classList.remove('hidden');
    return;
  }
  entraInApp();
});

$('esci').addEventListener('click', async () => { await sb.auth.signOut(); mostraLogin(); });

preparaInterfaccia();
/* Offline il login non si puo' verificare: se sul telefono c'e' gia' un
   listino scaricato dopo un accesso valido, si entra comunque. */
let session = null;
try { session = (await conTimeout(sb.auth.getSession(), 4000)).data?.session || null; }
catch { session = null; }
if (session || (!navigator.onLine && leggi(CACHE_KEY))) entraInApp();
else if (!session && leggi(CACHE_KEY) && leggi('pr-antizanzare-auth')) entraInApp();
else mostraLogin();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
